<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>揀樓助手 - 景觀對比版</title>
    <style>
        body { font-family: "PingFang HK", sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .nav { text-align: center; position: sticky; top: 0; background: #f0f2f5; padding: 10px; z-index: 1000; border-bottom: 2px solid #ddd; }
        h1 { margin: 5px; font-size: 20px; }
        
        button { padding: 10px 15px; font-size: 14px; cursor: pointer; border: none; border-radius: 5px; margin: 2px; }
        .btn-nav { background-color: #007bff; color: white; }
        .btn-nav.active { background-color: #0056b3; font-weight: bold; border: 2px solid #000; }
        .btn-reset { background-color: #dc3545; color: white; }

        .view-section { display: none; padding-top: 20px; }
        .view-section.active { display: block; }

        /* 表格樣式 */
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        table { border-collapse: collapse; background: white; margin-bottom: 30px; }
        th, td { border: 1px solid #ccc; width: 40px; height: 35px; text-align: center; cursor: pointer; }
        .sold { background-color: #d1d1d1 !important; color: #888; text-decoration: line-through; }
        .floor-label { background-color: #eee; width: 50px; cursor: default; }

        /* 景觀分頁樣式 */
        .comparison-group { background: white; border-radius: 10px; padding: 15px; margin-bottom: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .group-title { background: #333; color: white; padding: 10px; border-radius: 5px; font-size: 18px; margin-bottom: 15px; }
        .photo-row { display: flex; gap: 10px; overflow-x: auto; }
        .photo-card { flex: 1; min-width: 350px; border: 1px solid #ddd; padding: 5px; }
        .photo-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .photo-card h3 { text-align: center; margin: 10px 0; font-size: 16px; color: #555; }
        
        /* 景觀頁樓層按鈕 */
        .floor-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px; }
        .unit-btn { background: #e8f5e9; border: 1px solid #2e7d32; color: #2e7d32; padding: 8px 0; font-size: 12px; }
        .unit-btn.sold { background: #d1d1d1; border: 1px solid #888; }
    </style>
</head>
<body>

<div class="nav">
    <h1>揀樓即時進度</h1>
    <button id="btnFull" class="btn-nav" onclick="switchView('full')">1. 全屋苑表</button>
    <button id="btnWatch" class="btn-nav" onclick="switchView('watch')">2. 精選清單</button>
    <button id="btnGallery" class="btn-nav active" onclick="switchView('gallery')">3. 景觀對比</button>
    <button class="btn-reset" onclick="resetData()">重置數據</button>
</div>

<!-- 1. 全屋苑視圖 -->
<div id="fullView" class="view-section">
    <div class="container">
        <div><h3>A座</h3><table id="tableFullA"></table></div>
        <div><h3>B座</h3><table id="tableFullB"></table></div>
    </div>
</div>

<!-- 2. 精選視圖 -->
<div id="watchView" class="view-section">
    <div class="container">
        <table id="watchTable">
            <thead><tr id="watchHead"><th>樓層</th></tr></thead>
            <tbody id="watchBody"></tbody>
        </table>
    </div>
</div>

<!-- 3. 景觀對比視圖 (重點) -->
<div id="galleryView" class="view-section active">
    <div id="galleryContainer" style="max-width: 1000px; margin: 0 auto;">
        <!-- 由 JavaScript 根據順序生成 -->
    </div>
</div>

<script>
    const config = {
        A: { maxFloor: 39, maxUnit: 21, startFloor: 20 },
        B: { maxFloor: 38, maxUnit: 18, startFloor: 20 },
        // 指定順序：B(6,8), A(4,6), B(4,5), A(11)
        watchlist: [
            { b: 'B', units: [6, 8], imgMid: 'B68_mid.jpg', imgHigh: 'B68_high.jpg', label: 'B座 6及8室' },
            { b: 'A', units: [4, 6], imgMid: 'A46_mid.jpg', imgHigh: 'A68_high.jpg', label: 'A座 4及6室' },
            { b: 'B', units: [4, 5], imgMid: 'B45_mid.jpg', imgHigh: 'B45_high.jpg', label: 'B座 4及5室' },
            { b: 'A', units: [11],    imgMid: 'A11_mid.jpg', imgHigh: 'A11_high.jpg', label: 'A座 11室' }
        ]
    };

    // 初始化所有介面
    function init() {
        initFullTable('A');
        initFullTable('B');
        initWatchTable();
        initGallery();
        loadData();
    }

    function initFullTable(bid) {
        const t = document.getElementById('tableFull' + bid);
        let h = `<tr><th>樓層</th>`;
        for(let u=1; u<=config[bid].maxUnit; u++) h += `<th>${u}</th>`;
        for(let f=config[bid].maxFloor; f>=20; f--) {
            h += `<tr><td class="floor-label">${f}F</td>`;
            for(let u=1; u<=config[bid].maxUnit; u++) {
                const id = `${bid}-${f}-${u}`;
                h += `<td id="f-${id}" onclick="toggleUnit('${id}')">${u}</td>`;
            }
            h += '</tr>';
        }
        t.innerHTML = h;
    }

    function initWatchTable() {
        const head = document.getElementById('watchHead');
        const body = document.getElementById('watchBody');
        const flatList = [];
        config.watchlist.forEach(g => g.units.forEach(u => flatList.push({b: g.b, u})));
        
        flatList.forEach(item => {
            const th = document.createElement('th');
            th.innerHTML = `${item.b}${item.u}`;
            head.appendChild(th);
        });

        for(let f=39; f>=20; f--) {
            let row = `<tr><td class="floor-label">${f}F</td>`;
            flatList.forEach(item => {
                const id = `${item.b}-${f}-${item.u}`;
                if(item.b === 'B' && f === 39) row += `<td style="background:#eee">-</td>`;
                else row += `<td id="w-${id}" onclick="toggleUnit('${id}')">${item.u}</td>`;
            });
            body.innerHTML += row + '</tr>';
        }
    }

    function initGallery() {
        const container = document.getElementById('galleryContainer');
        config.watchlist.forEach(group => {
            let html = `<div class="comparison-group">
                <div class="group-title">${group.label} - 景觀對比</div>
                <div class="photo-row">
                    <div class="photo-card">
                        <img src="${group.imgMid}" onerror="this.src='https://via.placeholder.com/400x200?text=Missing+Mid+Photo'">
                        <h3>中層景觀 (20-29樓)</h3>
                        <div class="floor-grid">${generateGalleryBtns(group, 20, 29)}</div>
                    </div>
                    <div class="photo-card">
                        <img src="${group.imgHigh}" onerror="this.src='https://via.placeholder.com/400x200?text=Missing+High+Photo'">
                        <h3>高層景觀 (30樓以上)</h3>
                        <div class="floor-grid">${generateGalleryBtns(group, 30, (group.b==='A'?39:38))}</div>
                    </div>
                </div>
            </div>`;
            container.innerHTML += html;
        });
    }

    function generateGalleryBtns(group, start, end) {
        let btns = '';
        for(let f=end; f>=start; f--) {
            group.units.forEach(u => {
                const id = `${group.b}-${f}-${u}`;
                btns += `<button id="g-${id}" class="unit-btn" onclick="toggleUnit('${id}')">${f}F (${u}室)</button>`;
            });
        }
        return btns;
    }

    // 核心邏輯：切換單位狀態
    function toggleUnit(commonId) {
        const elements = [
            document.getElementById(`f-${commonId}`),
            document.getElementById(`w-${commonId}`),
            document.getElementById(`g-${commonId}`)
        ];
        elements.forEach(el => {
            if(el) el.classList.toggle('sold');
        });
        saveData();
    }

    function switchView(view) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        document.getElementById(view + 'View').classList.add('active');
        document.getElementById('btn' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('active');
        window.scrollTo(0,0);
    }

    function saveData() {
        const sold = [];
        document.querySelectorAll('#fullView td.sold').forEach(el => sold.push(el.id.replace('f-', '')));
        localStorage.setItem('flat_status_v3', JSON.stringify(sold));
    }

    function loadData() {
        const saved = JSON.parse(localStorage.getItem('flat_status_v3') || '[]');
        saved.forEach(id => {
            const el1 = document.getElementById(`f-${id}`);
            const el2 = document.getElementById(`w-${id}`);
            const el3 = document.getElementById(`g-${id}`);
            if(el1) el1.classList.add('sold');
            if(el2) el2.classList.add('sold');
            if(el3) el3.classList.add('sold');
        });
    }

    function resetData() {
        if(confirm('確定清除所有數據？')) {
            localStorage.removeItem('flat_status_v3');
            location.reload();
        }
    }

    init();
</script>

</body>
</html>
