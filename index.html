<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>揀樓同步助手 - 所有人實時同步</title>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: "PingFang HK", sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .nav { text-align: center; position: sticky; top: 0; background: #f0f2f5; padding: 10px; z-index: 1000; border-bottom: 2px solid #ddd; }
        .status-bar { background: #333; color: #fff; padding: 5px; text-align: center; font-size: 12px; }
        button { padding: 10px 15px; font-size: 14px; cursor: pointer; border: none; border-radius: 5px; margin: 2px; }
        .btn-nav { background-color: #007bff; color: white; }
        .btn-nav.active { background-color: #0056b3; font-weight: bold; border: 2px solid #000; }
        .btn-reset { background-color: #dc3545; color: white; }
        .view-section { display: none; padding-top: 20px; }
        .view-section.active { display: block; }
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        table { border-collapse: collapse; background: white; margin-bottom: 30px; }
        th, td { border: 1px solid #ccc; width: 40px; height: 35px; text-align: center; cursor: pointer; }
        .sold { background-color: #d1d1d1 !important; color: #888 !important; text-decoration: line-through !important; }
        .floor-label { background-color: #eee; width: 50px; cursor: default; }
        .comparison-group { background: white; border-radius: 10px; padding: 15px; margin-bottom: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .group-title { background: #333; color: white; padding: 10px; border-radius: 5px; font-size: 18px; margin-bottom: 15px; }
        .photo-row { display: flex; gap: 10px; overflow-x: auto; }
        .photo-card { flex: 1; min-width: 350px; border: 1px solid #ddd; padding: 5px; }
        .photo-card img { width: 100%; height: 200px; object-fit: cover; }
        .floor-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px; }
        .unit-btn { background: #e8f5e9; border: 1px solid #2e7d32; color: #2e7d32; padding: 8px 0; font-size: 12px; }
        .unit-btn.sold { background: #d1d1d1; border: 1px solid #888; color: #888; }
    </style>
</head>
<body>

<div class="status-bar" id="syncStatus">正在連線至雲端資料庫...</div>

<div class="nav">
    <h1>揀樓實時同步 (多人協作版)</h1>
    <button id="btnGallery" class="btn-nav active" onclick="switchView('gallery')">1. 景觀對比</button>
    <button id="btnWatch" class="btn-nav" onclick="switchView('watch')">2. 精選清單</button>
    <button id="btnFull" class="btn-nav" onclick="switchView('full')">3. 全屋苑表</button>
    <button class="btn-reset" onclick="resetData()">清空所有數據</button>
</div>

<div id="galleryView" class="view-section active">
    <div id="galleryContainer" style="max-width: 1000px; margin: 0 auto;"></div>
</div>

<div id="watchView" class="view-section">
    <div class="container"><table id="watchTable"><thead><tr id="watchHead"><th>樓層</th></tr></thead><tbody id="watchBody"></tbody></table></div>
</div>

<div id="fullView" class="view-section">
    <div class="container">
        <div><h3>A座</h3><table id="tableFullA"></table></div>
        <div><h3>B座</h3><table id="tableFullB"></table></div>
    </div>
</div>

<script>
    // --- !!! 請在此替換你的 Firebase 設定 !!! ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com", // 這是 Realtime Database 的網址
        projectId: "YOUR_PROJECT_ID",
        appId: "YOUR_APP_ID"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const flatsRef = db.ref('soldFlats');

    const config = {
        A: { maxFloor: 39, maxUnit: 21, startFloor: 20 },
        B: { maxFloor: 38, maxUnit: 18, startFloor: 20 },
        watchlist: [
            { b: 'B', units: [6, 8], imgMid: 'B68_mid.jpg', imgHigh: 'B68_high.jpg', label: 'B座 6及8室' },
            { b: 'A', units: [4, 6], imgMid: 'A46_mid.jpg', imgHigh: 'A68_high.jpg', label: 'A座 4及6室' },
            { b: 'B', units: [4, 5], imgMid: 'B45_mid.jpg', imgHigh: 'B45_high.jpg', label: 'B座 4及5室' },
            { b: 'A', units: [11],    imgMid: 'A11_mid.jpg', imgHigh: 'A11_high.jpg', label: 'A座 11室' }
        ]
    };

    function init() {
        initFullTable('A'); initFullTable('B');
        initWatchTable(); initGallery();
        listenToCloud(); // 開始實時監聽雲端
    }

    function initFullTable(bid) {
        const t = document.getElementById('tableFull' + bid);
        let h = `<tr><th>樓層</th>`;
        for(let u=1; u<=config[bid].maxUnit; u++) h += `<th>${u}</th>`;
        for(let f=config[bid].maxFloor; f>=20; f--) {
            h += `<tr><td class="floor-label">${f}F</td>`;
            for(let u=1; u<=config[bid].maxUnit; u++) {
                const id = `${bid}-${f}-${u}`;
                h += `<td id="f-${id}" class="unit-cell" onclick="toggleCloud('${id}')">${u}</td>`;
            }
            h += '</tr>';
        }
        t.innerHTML = h;
    }

    function initWatchTable() {
        const head = document.getElementById('watchHead');
        const body = document.getElementById('watchBody');
        const flatList = [];
        config.watchlist.forEach(g => g.units.forEach(u => flatList.push({b: g.b, u})));
        flatList.forEach(item => { const th = document.createElement('th'); th.innerHTML = `${item.b}${item.u}`; head.appendChild(th); });
        for(let f=39; f>=20; f--) {
            let row = `<tr><td class="floor-label">${f}F</td>`;
            flatList.forEach(item => {
                const id = `${item.b}-${f}-${item.u}`;
                if(item.b === 'B' && f === 39) row += `<td style="background:#eee">-</td>`;
                else row += `<td id="w-${id}" class="unit-cell" onclick="toggleCloud('${id}')">${item.u}</td>`;
            });
            body.innerHTML += row + '</tr>';
        }
    }

    function initGallery() {
        const container = document.getElementById('galleryContainer');
        config.watchlist.forEach(group => {
            container.innerHTML += `<div class="comparison-group">
                <div class="group-title">${group.label}</div>
                <div class="photo-row">
                    <div class="photo-card"><img src="${group.imgMid}"><h3>中層 (20-29F)</h3><div class="floor-grid">${generateBtns(group, 20, 29)}</div></div>
                    <div class="photo-card"><img src="${group.imgHigh}"><h3>高層 (30F+)</h3><div class="floor-grid">${generateBtns(group, 30, (group.b=='A'?39:38))}</div></div>
                </div>
            </div>`;
        });
    }

    function generateBtns(group, start, end) {
        let btns = '';
        for(let f=end; f>=start; f--) {
            group.units.forEach(u => {
                const id = `${group.b}-${f}-${u}`;
                btns += `<button id="g-${id}" class="unit-btn" onclick="toggleCloud('${id}')">${f}F(${u})</button>`;
            });
        }
        return btns;
    }

    // --- 雲端同步邏輯 ---

    // 當有人點擊時，更新雲端
    function toggleCloud(id) {
        const cell = document.getElementById(`f-${id}`);
        const isSold = cell.classList.contains('sold');
        // 寫入 Firebase: 如果已售則刪除，未售則設為 true
        flatsRef.child(id).set(isSold ? null : true);
    }

    // 實時監聽雲端數據變化
    function listenToCloud() {
        flatsRef.on('value', (snapshot) => {
            const soldData = snapshot.val() || {};
            document.getElementById('syncStatus').innerText = "雲端同步中 - 連線正常";
            
            // 先清除所有人的 sold 狀態
            document.querySelectorAll('.sold').forEach(el => el.classList.remove('sold'));
            
            // 根據雲端數據重新標記
            Object.keys(soldData).forEach(id => {
                const elements = [document.getElementById(`f-${id}`), document.getElementById(`w-${id}`), document.getElementById(`g-${id}`)];
                elements.forEach(el => { if(el) el.classList.add('sold'); });
            });
        }, (error) => {
            document.getElementById('syncStatus').innerText = "連線錯誤: " + error.message;
        });
    }

    function resetData() {
        if(confirm('注意：這會清空「所有使用者」看到的數據！確定嗎？')) {
            flatsRef.set(null);
        }
    }

    function switchView(view) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
        document.getElementById(view + 'View').classList.add('active');
        document.getElementById('btn' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('active');
        window.scrollTo(0,0);
    }

    init();
</script>
</body>
</html>
